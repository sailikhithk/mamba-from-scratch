[project]
name = "mamba-from-scratch"
version = "0.1.0"
description = "Educational from-scratch implementation of S4, Mamba-1 (S6), and Mamba-2 (SSD)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]
bench = ["mamba-ssm>=2.0", "causal-conv1d>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
