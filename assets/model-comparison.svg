<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="auto" role="img" aria-label="Sequence model comparison: RNN, Transformer, S4, and Mamba state-space models">
  <style>
    .title { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
    .card-label { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 13px; font-weight: 600; fill: #1e293b; text-anchor: middle; }
    .card-desc { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 11px; fill: #475569; }
    .bullet { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #64748b; }
    .bestfor { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; font-weight: 600; fill: #1e293b; }
    .number { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 16px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f1f5f9; }
      .subtitle { fill: #94a3b8; }
      .card-label { fill: #e2e8f0; }
      .card-desc { fill: #cbd5e1; }
      .bullet { fill: #94a3b8; }
      .bestfor { fill: #e2e8f0; }
    }
  </style>

  <text x="440" y="32" class="title">Sequence Models Compared</text>
  <text x="440" y="52" class="subtitle">RNN - Transformer - S4 - Mamba: why each exists and where each wins</text>

  <!-- Card 1: RNN -->
  <rect x="20" y="75" width="200" height="380" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <circle cx="70" cy="108" r="15" fill="#22c55e"/>
  <text x="70" y="114" class="number" fill="#fff" text-anchor="middle">1</text>
  <text x="120" y="114" class="card-label" text-anchor="start">RNN</text>
  <text x="35" y="138" class="card-desc">Recurrent step-by-step hidden state. Memory compressed into h[t].</text>

  <rect x="45" y="160" width="150" height="80" rx="6" fill="#dcfce7" stroke="#86efac"/>
  <text x="80" y="178" class="card-desc" text-anchor="middle" font-size="10">h<t-1></text>
  <text x="120" y="190" class="card-desc" text-anchor="middle" font-size="14">h<t></text>
  <text x="160" y="202" class="card-desc" text-anchor="middle" font-size="10">h<t+1></text>
  <line x1="85" y1="190" x2="105" y2="190" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="135" y1="190" x2="155" y2="190" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="120" y="218" class="card-desc" text-anchor="middle" font-size="9" fill="#15803d">O(1) memory per step</text>
  <text x="120" y="233" class="card-desc" text-anchor="middle" font-size="9" fill="#15803d">O(N) time</text>

  <text x="35" y="280" class="bullet">• Fast inference per token</text>
  <text x="35" y="300" class="bullet">• Vanishing gradient</text>
  <text x="35" y="320" class="bullet">• Short-range memory only</text>

  <rect x="35" y="350" width="170" height="80" rx="6" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="120" y="370" class="bestfor" text-anchor="middle">Best for</text>
  <text x="120" y="390" class="bullet" text-anchor="middle">Streaming / online</text>
  <text x="120" y="405" class="bullet" text-anchor="middle">tasks where you must</text>
  <text x="120" y="420" class="bullet" text-anchor="middle">output one token at a time</text>

  <!-- Card 2: Transformer -->
  <rect x="230" y="75" width="200" height="380" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="280" cy="108" r="15" fill="#3b82f6"/>
  <text x="280" y="114" class="number" fill="#fff" text-anchor="middle">2</text>
  <text x="330" y="114" class="card-label" text-anchor="start">Transformer</text>
  <text x="245" y="138" class="card-desc">Self-attention over all positions. Quadratic cost in sequence length.</text>

  <rect x="255" y="160" width="150" height="80" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="330" y="178" class="card-desc" text-anchor="middle" font-size="10" font-weight="600" fill="#1d4ed8">Attention</text>
  <text x="330" y="198" class="card-desc" text-anchor="middle" font-size="9">Q x K^T -> softmax -> V</text>
  <text x="330" y="218" class="card-desc" text-anchor="middle" font-size="9" fill="#1d4ed8">O(N^2) time</text>
  <text x="330" y="233" class="card-desc" text-anchor="middle" font-size="9" fill="#1d4ed8">O(N^2) memory</text>

  <text x="245" y="280" class="bullet">• Parallel training</text>
  <text x="245" y="300" class="bullet">• Long-range dependencies</text>
  <text x="245" y="320" class="bullet">• Slow at long context</text>

  <rect x="245" y="350" width="170" height="80" rx="6" fill="#dbeafe" stroke="#bfdbfe"/>
  <text x="330" y="370" class="bestfor" text-anchor="middle">Best for</text>
  <text x="330" y="390" class="bullet" text-anchor="middle">Language modeling</text>
  <text x="330" y="405" class="bullet" text-anchor="middle">where training parallel</text>
  <text x="330" y="420" class="bullet" text-anchor="middle">dominates inference cost</text>

  <!-- Card 3: S4 -->
  <rect x="440" y="75" width="200" height="380" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="490" cy="108" r="15" fill="#f59e0b"/>
  <text x="490" y="114" class="number" fill="#fff" text-anchor="middle">3</text>
  <text x="540" y="114" class="card-label" text-anchor="start">S4</text>
  <text x="455" y="138" class="card-desc">Linear state-space model. HiPPO memory, train as convolution.</text>

  <rect x="465" y="160" width="150" height="80" rx="6" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="540" y="178" class="card-desc" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">h' = Ah + Bx</text>
  <text x="540" y="198" class="card-desc" text-anchor="middle" font-size="10" font-weight="600" fill="#92400e">y = Ch</text>
  <text x="540" y="218" class="card-desc" text-anchor="middle" font-size="9">O(N log N) training</text>
  <text x="540" y="233" class="card-desc" text-anchor="middle" font-size="9">O(N) inference</text>

  <text x="455" y="280" class="bullet">• Linear complexity</text>
  <text x="455" y="300" class="bullet">• Long memory from HiPPO</text>
  <text x="455" y="320" class="bullet">• Input-independent</text>

  <rect x="455" y="350" width="170" height="80" rx="6" fill="#fef3c7" stroke="#fde68a"/>
  <text x="540" y="370" class="bestfor" text-anchor="middle">Best for</text>
  <text x="540" y="390" class="bullet" text-anchor="middle">Long-sequence audio</text>
  <text x="540" y="405" class="bullet" text-anchor="middle">and DNA where context</text>
  <text x="540" y="420" class="bullet" text-anchor="middle">length matters most</text>

  <!-- Card 4: Mamba -->
  <rect x="650" y="75" width="200" height="380" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="700" cy="108" r="15" fill="#8b5cf6"/>
  <text x="700" y="114" class="number" fill="#fff" text-anchor="middle">4</text>
  <text x="750" y="114" class="card-label" text-anchor="start">Mamba</text>
  <text x="665" y="138" class="card-desc">Selective SSM: parameters become input-dependent. Selective scan.</text>

  <rect x="675" y="160" width="150" height="80" rx="6" fill="#ede9fe" stroke="#c4b5fd"/>
  <text x="750" y="178" class="card-desc" text-anchor="middle" font-size="10" font-weight="600" fill="#6d28d9">B(t), C(t), Delta(t)</text>
  <text x="750" y="198" class="card-desc" text-anchor="middle" font-size="9">input-dependent gates</text>
  <text x="750" y="218" class="card-desc" text-anchor="middle" font-size="9" fill="#6d28d9">O(N) time &amp; memory</text>
  <text x="750" y="233" class="card-desc" text-anchor="middle" font-size="9" fill="#6d28d9">hardware-aware scan</text>

  <text x="665" y="280" class="bullet">• Linear like S4</text>
  <text x="665" y="300" class="bullet">• Content-aware gating</text>
  <text x="665" y="320" class="bullet">• Near-Transformer quality</text>

  <rect x="665" y="350" width="170" height="80" rx="6" fill="#ede9fe" stroke="#ddd6fe"/>
  <text x="750" y="370" class="bestfor" text-anchor="middle">Best for</text>
  <text x="750" y="390" class="bullet" text-anchor="middle">Long-context language</text>
  <text x="750" y="405" class="bullet" text-anchor="middle">where you need RNN</text>
  <text x="750" y="420" class="bullet" text-anchor="middle">speed + quality</text>

  <text x="440" y="490" class="subtitle">This repo implements S4, Mamba-1 (S6), and Mamba-2 (SSD) from scratch in PyTorch.</text>
</svg>
