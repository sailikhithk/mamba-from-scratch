<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 545" width="100%" height="auto" role="img" aria-label="Sequence model comparison: RNN, Transformer, S4, and Mamba state-space models">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    .title { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; text-anchor: middle; }
    .subtitle { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 12px; fill: #475569; text-anchor: middle; }
    .card-label { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 15px; font-weight: 700; fill: #1e293b; }
    .card-desc { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 11px; fill: #475569; }
    .bullet { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #475569; }
    .best-label { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 11px; font-weight: 700; fill: #1e293b; text-anchor: middle; }
    .best-text { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
    .number { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 15px; font-weight: 700; }
    .inner { font-family: -apple-system, Segoe UI, Helvetica, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .title { fill: #f1f5f9; }
      .subtitle { fill: #94a3b8; }
      .card-label { fill: #e2e8f0; }
      .card-desc { fill: #cbd5e1; }
      .bullet { fill: #cbd5e1; }
      .best-label { fill: #e2e8f0; }
      .best-text { fill: #cbd5e1; }
      .inner { fill: #cbd5e1; }
    }
  </style>

  <text x="550" y="32" class="title">Sequence Models Compared</text>
  <text x="550" y="52" class="subtitle">RNN - Transformer - S4 - Mamba: where each wins</text>

  <!-- Card 1: RNN -->
  <rect x="40" y="75" width="240" height="470" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="64" cy="108" r="13" fill="#22c55e"/>
  <text x="64" y="113" class="number" fill="#fff" text-anchor="middle">1</text>
  <text x="88" y="113" class="card-label">RNN</text>
  <text x="58" y="140" class="card-desc">Recurrent step-by-step hidden state.
    <tspan x="58" dy="15">Memory is compressed into h at each step.</tspan>
  </text>

  <rect x="58" y="175" width="204" height="110" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <g transform="translate(58, 175)">
    <text x="40" y="20" class="inner" style="font-size:10px">h&lt;t-1&gt;</text>
    <text x="102" y="45" class="inner" style="font-size:14px; font-weight:600; fill:#15803d">h&lt;t&gt;</text>
    <text x="164" y="20" class="inner" style="font-size:10px">h&lt;t+1&gt;</text>
    <line x1="70" y1="45" x2="78" y2="45" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <line x1="126" y1="45" x2="134" y2="45" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="102" y="85" class="inner" style="font-size:9px; fill:#15803d">O(1) memory per step</text>
    <text x="102" y="100" class="inner" style="font-size:9px; fill:#15803d">O(N) time</text>
  </g>

  <text x="58" y="313" class="bullet">• Fast inference per token</text>
  <text x="58" y="328" class="bullet">• Vanishing gradient problem</text>
  <text x="58" y="343" class="bullet">• Short-range memory only</text>

  <rect x="58" y="420" width="204" height="100" rx="8" fill="#dcfce7" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="160" y="442" class="best-label">Best for</text>
  <text x="160" y="462" class="best-text">Streaming tasks where you must</text>
  <text x="160" y="477" class="best-text">emit one token at a time</text>

  <!-- Card 2: Transformer -->
  <rect x="300" y="75" width="240" height="470" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <circle cx="324" cy="108" r="13" fill="#3b82f6"/>
  <text x="324" y="113" class="number" fill="#fff" text-anchor="middle">2</text>
  <text x="348" y="113" class="card-label">Transformer</text>
  <text x="318" y="140" class="card-desc">Self-attention over all positions.
    <tspan x="318" dy="15">Quadratic cost in sequence length.</tspan>
  </text>

  <rect x="318" y="175" width="204" height="110" rx="8" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/>
  <g transform="translate(318, 175)">
    <text x="102" y="25" class="inner" style="font-size:12px; font-weight:600; fill:#1d4ed8">Attention</text>
    <text x="102" y="45" class="inner" style="font-size:10px">Q x K^T → softmax → V</text>
    <text x="102" y="75" class="inner" style="font-size:10px; fill:#1d4ed8">O(N²) time</text>
    <text x="102" y="92" class="inner" style="font-size:10px; fill:#1d4ed8">O(N²) memory</text>
  </g>

  <text x="318" y="313" class="bullet">• Fully parallel training</text>
  <text x="318" y="328" class="bullet">• Long-range dependencies</text>
  <text x="318" y="343" class="bullet">• Slow at long context</text>

  <rect x="318" y="420" width="204" height="100" rx="8" fill="#dbeafe" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="420" y="442" class="best-label">Best for</text>
  <text x="420" y="462" class="best-text">Language modeling where</text>
  <text x="420" y="477" class="best-text">training parallel dominates cost</text>

  <!-- Card 3: S4 -->
  <rect x="560" y="75" width="240" height="470" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
  <circle cx="584" cy="108" r="13" fill="#f59e0b"/>
  <text x="584" y="113" class="number" fill="#fff" text-anchor="middle">3</text>
  <text x="608" y="113" class="card-label">S4</text>
  <text x="578" y="140" class="card-desc">Linear state-space model with
    <tspan x="578" dy="15">HiPPO init and convolution training.</tspan>
  </text>

  <rect x="578" y="175" width="204" height="110" rx="8" fill="#fef3c7" stroke="#fcd34d" stroke-width="1.5"/>
  <g transform="translate(578, 175)">
    <text x="102" y="28" class="inner" style="font-size:12px; font-weight:600; fill:#92400e">h' = A h + B x</text>
    <text x="102" y="48" class="inner" style="font-size:12px; font-weight:600; fill:#92400e">y = C h</text>
    <text x="102" y="75" class="inner" style="font-size:10px; fill:#92400e">O(N log N) training</text>
    <text x="102" y="92" class="inner" style="font-size:10px; fill:#92400e">O(N) inference</text>
  </g>

  <text x="578" y="313" class="bullet">• Linear complexity</text>
  <text x="578" y="328" class="bullet">• Long memory from HiPPO</text>
  <text x="578" y="343" class="bullet">• Input-independent</text>

  <rect x="578" y="420" width="204" height="100" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5"/>
  <text x="680" y="442" class="best-label">Best for</text>
  <text x="680" y="462" class="best-text">Long-sequence audio and DNA</text>
  <text x="680" y="477" class="best-text">where context length matters</text>

  <!-- Card 4: Mamba -->
  <rect x="820" y="75" width="240" height="470" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2.5"/>
  <circle cx="844" cy="108" r="13" fill="#8b5cf6"/>
  <text x="844" y="113" class="number" fill="#fff" text-anchor="middle">4</text>
  <text x="868" y="113" class="card-label">Mamba</text>
  <text x="838" y="140" class="card-desc">Selective SSM: parameters become
    <tspan x="838" dy="15">input-dependent through a selection gate.</tspan>
  </text>

  <rect x="838" y="175" width="204" height="110" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5"/>
  <g transform="translate(838, 175)">
    <text x="102" y="25" class="inner" style="font-size:12px; font-weight:600; fill:#6d28d9">B(t), C(t), Δ(t)</text>
    <text x="102" y="45" class="inner" style="font-size:10px">input-dependent gates</text>
    <text x="102" y="72" class="inner" style="font-size:10px; fill:#6d28d9">O(N) time &amp; memory</text>
    <text x="102" y="89" class="inner" style="font-size:10px; fill:#6d28d9">hardware-aware scan</text>
  </g>

  <text x="838" y="313" class="bullet">• Linear like S4</text>
  <text x="838" y="328" class="bullet">• Content-aware gating</text>
  <text x="838" y="343" class="bullet">• Near-Transformer quality</text>

  <rect x="838" y="420" width="204" height="100" rx="8" fill="#ede9fe" stroke="#ddd6fe" stroke-width="1.5"/>
  <text x="940" y="442" class="best-label">Best for</text>
  <text x="940" y="462" class="best-text">Long-context language where</text>
  <text x="940" y="477" class="best-text">you need RNN speed plus quality</text>

  <text x="550" y="535" class="subtitle">This repo implements S4, Mamba-1 (S6), and Mamba-2 (SSD) from scratch.</text>
</svg>